[package]
name = "ainovr"
version = "0.1.0"
description = "Ainovr - 文本生产可视化工作流平台"
authors = ["Ainovr"]
edition = "2021"

[lib]
name = "ainovr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
